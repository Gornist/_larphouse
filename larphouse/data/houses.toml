# Дома из клеток 3,1 × 3,1 м.
#   NX — клеток вдоль конька (любое), NY — поперёк (1 — малые фермы, 2 — большие).
#   Проёмы периметра: S, N — вдоль X (по клеткам слева направо),
#                     W, E — вдоль Y (снизу вверх).
#   В проёме: "окно" | "глухой" | "дверь". Внутренние проёмы открыты.
#   title — как дом называется в документах.
# Новый дом — новая секция; затем  python -m larphouse all <ключ>

[3x3]
title = "3х3"
NX = 1
NY = 1
S = ["окно"]
N = ["окно"]
W = ["дверь"]
E = ["окно"]

[3x6]
title = "3х6"
NX = 2
NY = 1
S = ["окно", "окно"]
N = ["глухой", "окно"]
W = ["дверь"]
E = ["окно"]

[3x9]
title = "3х9"
NX = 3
NY = 1
S = ["окно", "окно", "окно"]
N = ["глухой", "окно", "глухой"]
W = ["дверь"]
E = ["окно"]

[6x6]
title = "6х6"
NX = 2
NY = 2
S = ["окно", "окно"]
N = ["окно", "окно"]
W = ["дверь", "глухой"]
E = ["окно", "глухой"]
